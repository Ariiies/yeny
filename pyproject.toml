[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yeny"
version = "0.1.0"
description = "A lightweight toolkit for building custom search systems in Python."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aries Meza"}
]
requires-python = ">=3.10"
dependencies = []
keywords = [
    "search",
    "search-engine",
    "full-text-search",
    "fts",
    "nlp",
    "tf-idf",
    "tokenizer",
    "indexing",
    "mmap",
    "sqlite",
    "inverted-index",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
alchemy = ["sqlalchemy"]
mysql = ["sqlalchemy", "pymysql"]
postgresql = ["sqlalchemy", "psycopg2-binary"]
benchmark = ["psutil>=5.9"]
# Dependencies for examples/encrypted_search (MySQL + Fernet + .env loading;
# psutil only powers the optional --measure-memory flag)
encrypted-search-example = [
    "sqlalchemy>=2.0",
    "pymysql>=1.0",
    "cryptography>=41.0",
    "python-dotenv>=1.0",
    "psutil>=5.9",
]
# Convenience alias: every extra needed to run all bundled examples
examples = [
    "sqlalchemy>=2.0",
    "pymysql>=1.0",
    "cryptography>=41.0",
    "python-dotenv>=1.0",
    "psutil>=5.9",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/Ariiies/yeny"
Repository = "https://github.com/Ariiies/yeny"
Documentation = "https://github.com/Ariiies/yeny/blob/main/docs/en/01-index.md"
Issues = "https://github.com/Ariiies/yeny/issues"
Funding = "https://github.com/sponsors/Ariiies"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yeny = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (fast)",
    "integration: Integration tests (slower)",
    "slow: Tests that take significant time",
]

[tool.coverage.run]
source = ["src/yeny"]
omit = [
    "*/__pycache__/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
precision = 2
show_missing = true