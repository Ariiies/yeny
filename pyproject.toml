[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucis"
version = "0.1.0"
description = "A minimalist NLP toolkit and search engine generator for Python."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aries Meza"}
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
alchemy = ["sqlalchemy"]
mysql = ["sqlalchemy", "pymysql"]
postgresql = ["sqlalchemy", "psycopg2-binary"]
benchmark = ["psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/Ariiies/lucis"
Repository = "https://github.com/Ariiies/lucis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lucis = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (fast)",
    "integration: Integration tests (slower)",
    "slow: Tests that take significant time",
]

[tool.coverage.run]
source = ["src/lucis"]
omit = [
    "*/__pycache__/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
precision = 2
show_missing = true